name: 潛在客群資料月度更新

on:
  schedule:
    # 每月 5 日 UTC 02:00（台灣時間 10:00）；戶政約落後 1–2 個月發布，財政部所得每年 8 月更新
    - cron: '0 2 5 * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  fetch-potential-buyers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 順序固定：村里主檔由戶政資料建立，所得資料需要它來對齊代碼
      - name: 戶政村里資料（人口、戶籍動態、遷徙）
        run: python scripts/fetch_ris_village.py

      - name: 財政部村里所得（未發布新年度時自動跳過）
        run: python scripts/fetch_fia_income.py

      # 戶政年資料（教育程度、戶數結構）＋平台村里季資料（戶長年齡、宅內人口數、宅內戶數）；需在村里主檔之後
      - name: 村里戶政年資料、戶長年齡
        run: python scripts/fetch_village_household.py

      - name: 實價登錄租賃
        run: python scripts/fetch_rentals.py

      # 國科會每月約 10–15 日發布上月資料；5 日執行時取到的是前一期
      - name: 科學園區從業員工（南科就業動能、產業別）
        run: python scripts/fetch_science_park.py

      # 不動產資訊平台（負擔能力、房貸、低度使用、稅籍屋齡）每次全量覆寫；台南開放資料抓今年與去年
      - name: 住宅市場統計（負擔能力、房貸利率、低度使用、屋齡存量、建物移轉）
        run: python scripts/fetch_housing_stats.py

      # 臺南市人口推估：約每 1–2 年改版；自動挑最新版次，同版重抓只會覆寫
      - name: 臺南市人口推估
        run: python scripts/fetch_population_projection.py
